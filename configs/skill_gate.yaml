# Skill-gate thresholds — single source of truth for the 6-stage GateRunner.
#
# Spec sources:
#   - plans/05-harness/PLAN-HARNESS.md §10  (G0–G5 stage labels)
#   - plans/07-skill-gate/PLAN-UNIFIED-SKILL-GATE.md §9  (canonical thresholds)
#   - implementation_notes/pre-training-readiness-audit.md §0.1 / §3 (T2.5)
#
# This file is the only place gate thresholds should live. Code that
# currently hard-codes thresholds (orchestrator/config.py::GateThresholds,
# harness/replay_validator.py:109, harness/few_shot_adapter.py defaults)
# is being migrated to read from here. Until that migration lands,
# any *drift* between code and YAML is annotated inline with `# drift:`
# so the audit log can attribute outcome changes to the right side.
#
# Versioning: bump `policy_version` whenever ANY threshold in this
# file changes. The orchestrator/promotion_orchestrator.py audit log
# carries `policy_version` in every release / rollback row so the
# §8 "change to acceptance thresholds" audit point in
# PLAN-PIPELINE-ORCHESTRATOR.md fires consistently.

policy_version: "v1.0.0"

# ── G0: Evidence-driven contract ───────────────────────────────────
# Static check — required_fields_present is binary (no soft pass).
# Lives entirely inside `harness/gate_service.py::stage_static`.
g0_static:
  required_fields_present: true
  contract_must_have_evidence_roles: true

# ── G1: Binding ─────────────────────────────────────────────────────
# Per-state binding viability — the EligibilityFilter +
# SkillHarness.validate_invocation second-pass veto. No replay,
# no shadow — pure typed-payload structural check + adapter
# availability + budget pre-check.
g1_binding:
  # An entry like { domain: gymv, allow_shadow: true } admits
  # SHADOW skills for the given domain at the eligibility-filter
  # level. The trainer's `--no-harness-allow-shadow` CLI flag flips
  # this to false at runtime; for the gate this is the *signed*
  # default the audit log records.
  allow_shadow: true
  # Maximum candidates the eligibility filter inspects per state
  # (mirrors `EligibilityFilter.max_candidates_per_state`).
  max_candidates_per_state: 16

# ── G2: Adapter ─────────────────────────────────────────────────────
# Adapter must be present in the registry AND its `validate(...)`
# call must pass. Stage failure modes: MISSING_ADAPTER,
# ADAPTER_EXCEPTION, BUDGET_EXCEEDED.
g2_adapter:
  per_invocation_budget:
    max_tokens: 4096
    max_hops: 8
    max_wall_ms: 30000

# ── G3: Replay ──────────────────────────────────────────────────────
# Re-run the skill against stored SkillEpisodes. Two modes:
#   adapter_level (default) — run skill end-to-end, compare outcome
#   action_level             — step-by-step diff against seed steps
g3_replay:
  contract_consistency_min: 0.80   # spec PLAN-UNIFIED-SKILL-GATE §9
  slot_binding_success_min: 0.80
  unsupported_step_ratio_max: 0.15
  # Pass rate floor — passing fraction of replay episodes.
  # drift: harness/replay_validator.py:109 hard-codes 0.8 today.
  pass_rate_min: 0.80
  default_mode: adapter_level

# ── G3a: Few-shot adaptation (transfer) ─────────────────────────────
# Stage 3a — the FewShotAdapter cross-task transfer cycle.
# Spec: PLAN-UNIFIED-SKILL-GATE §7 / §9; PLAN-SKILL-BANK §0.4.
g3a_few_shot:
  k_shot_default: 5
  k_shot_max: 16
  # drift: code default is 0.50, spec floor is 0.50 (matching).
  target_domain_pass_rate_min: 0.50
  adaptation_cost_max_tokens: 8000

# ── G4: Shadow ──────────────────────────────────────────────────────
# Live shadow run — the skill is executed alongside the live actor
# but its decisions are not bound. Failures here update
# `SkillRecord.false_binding_patterns` via the RejectedSkillSink.
g4_shadow:
  # drift: orchestrator/config.py::GateThresholds.shadow_pass_rate
  # = 0.7 (live) vs PLAN-UNIFIED-SKILL-GATE §9 = 0.75 (spec).
  # We pin the spec value here; code consumer must catch up
  # (T2.5 follow-up — track in audit log on next bump).
  pass_rate_min: 0.75
  severe_instability_max: 0.05
  contradiction_rate_max: 0.10

# ── G5: Non-regression ──────────────────────────────────────────────
# Source-domain pass-rate must not drop more than ε vs. the prior
# bank snapshot for the EvalSuite (PLAN-PIPELINE-ORCHESTRATOR §3.1.4).
g5_non_regression:
  source_drop_max: 0.02
  retrieval_hit_at_k_drop_max: 0.05

# ── Transfer (cross-domain) — promotion-side knob ───────────────────
# Asymmetric, few-shot-driven (PLAN-SKILL-BANK §0.4). A skill must
# clear G3a on at least `min_target_domains_verified` of the 4
# transfer-target domains to be ACTIVE.
transfer:
  min_target_domains_verified: 1
  # drift: orchestrator/config.py keeps the legacy
  # `transfer_min_domains: 2` symmetric knob alive for backward
  # compat; we DO NOT use it. The asymmetric knob above wins.
  per_domain_pass_rate_min: 0.65
  degradation_ratio_max: 0.20
  ontology_remap_consistency_min: 0.75

# ── Promotion (PROVISIONAL → ACTIVE) ────────────────────────────────
# Post-gate cadence rules used by orchestrator/promotion_orchestrator.py.
promotion:
  provisional_active_window_episodes: 200
  provisional_min_pass_rate: 0.70
  shadow_origin_penalty: 0.30
  # T1.3d: lane-(a) replacement for the legacy "feasible_domains ≥ 2"
  # ACTIVE invariant (PLAN-SKILL-BANK §0.1, now superseded). A skill
  # graduates to ACTIVE only after it has been *retrieved* (selected
  # by the actor's filter_candidates pipeline) at least this many
  # times — single-domain gymv banks ARE allowed. Counted via
  # ``SkillRecord.metrics["retrievals"]`` (incremented by the harness
  # on every successful skill invocation); enforced by
  # ``SkillLifecycleManager._validate_invariants`` when the lifecycle
  # is constructed with this threshold (orchestrator does so via
  # ``OrchestratorConfig.gate_thresholds.min_retrievals_per_skill``).
  min_retrievals_per_skill: 3

# ── Audit / drift policy ────────────────────────────────────────────
# When set to `strict`, the GateRunner refuses to start if the live
# code's hard-coded threshold does not match the YAML. When `warn`,
# it logs the drift to `audit.jsonl` (kind=`policy_drift`) and
# proceeds with the YAML value. Default warn until the migration
# of hard-coded thresholds is complete.
audit:
  drift_policy: warn
  emit_policy_drift_audit_rows: true
