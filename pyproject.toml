[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cos-play"
version = "0.1.0"
description = "Co-Evolving LLM Decision and Skill Bank Agents for Long-Horizon Tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
authors = [{ name = "Xiyang Wu" }]
keywords = ["llm", "reinforcement-learning", "skill-learning", "game-agents", "grpo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "transformers>=4.51.0",
    "sentence-transformers>=2.7.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "httpx>=0.24",
    "loguru>=0.7.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
train = [
    "peft>=0.17",
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "tensorboard>=2.14",
]
inference = ["vllm>=0.20.0"]
textenv = [
    "alfworld>=0.4",
    "gym>=0.26",
    "beautifulsoup4>=4.12",
    "flask>=2.0",
]
dev = ["pytest>=7.0"]
all = ["cos-play[train,inference,textenv,dev]"]

[project.urls]
Homepage = "https://github.com/wuxiyang1996/COS-PLAY"
Repository = "https://github.com/wuxiyang1996/COS-PLAY"
Paper = "https://arxiv.org/abs/2604.20987"

[tool.setuptools]
py-modules = ["API_func"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "decision_agents*",
    "skill_agents_grpo*",
    "trainer*",
    "data_structure*",
    "env_wrappers*",
    "rag*",
    "cold_start*",
    "labeling*",
    "inference*",
    "evaluate_gamingagent*",
    "evaluate_orak*",
    "evaluation_evolver*",
    "baselines*",
    "ablation_study*",
]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
